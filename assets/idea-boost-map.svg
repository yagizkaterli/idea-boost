<svg xmlns="http://www.w3.org/2000/svg" width="640" height="248" viewBox="0 0 640 248" font-family="'Cascadia Code','Consolas',ui-monospace,monospace">
  <!-- RE-katalog: kilitliSureler [120,140,150,180,260,420,620] · canonicalEase cubic-bezier(.22,1,.36,1)
       siniflar: yandan-gel (icerik yandan gelir -- sira/akis, genlik 20) · gel-otur · belir · ciz -->
  <rect width="640" height="248" rx="12" fill="#0E0D13"/>
  <rect x="0" y="0" width="640" height="32" rx="12" fill="#14131C"/>
  <rect x="0" y="20" width="640" height="12" fill="#14131C"/>
  <circle cx="20" cy="16" r="4.5" fill="#F4645D"/>
  <circle cx="37" cy="16" r="4.5" fill="#F9BD4F"/>
  <circle cx="54" cy="16" r="4.5" fill="#3FC84F"/>
  <text x="320" y="21" text-anchor="middle" fill="#8B8798" font-size="11.5">idea-boost — five bursts, one grounded map</text>

  <!-- seeds arriving from the left: yandan-gel, genlik 20px, 180ms stagger -->
  <text x="42" y="54" fill="#5C5870" font-size="9">SEEDS</text>
  <g font-size="8.5">
    <g opacity="0" transform="translate(-20,0)">
      <rect x="40" y="62" width="152" height="19" rx="4" fill="#171526"/>
      <text x="50" y="75" fill="#B1A3C8">what if rooms had presence</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="0.3s;9.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0;0 0" dur="180ms" begin="0.3s;9.3s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(-20,0)">
      <rect x="40" y="86" width="152" height="19" rx="4" fill="#171526"/>
      <text x="50" y="99" fill="#B1A3C8">and receipts could chain</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="0.42s;9.42s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0;0 0" dur="180ms" begin="0.42s;9.42s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(-20,0)">
      <rect x="40" y="110" width="152" height="19" rx="4" fill="#171526"/>
      <text x="50" y="123" fill="#B1A3C8">maybe a tribe roster too</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="0.54s;9.54s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0;0 0" dur="180ms" begin="0.54s;9.54s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(-20,0)">
      <rect x="40" y="134" width="152" height="19" rx="4" fill="#171526"/>
      <text x="50" y="147" fill="#B1A3C8">also a decision surface</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="0.66s;9.66s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0;0 0" dur="180ms" begin="0.66s;9.66s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(-20,0)">
      <rect x="40" y="158" width="152" height="19" rx="4" fill="#171526"/>
      <text x="50" y="171" fill="#B1A3C8">and the graph, obviously</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="0.78s;9.78s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-20 0;0 0" dur="180ms" begin="0.78s;9.78s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
  </g>

  <!-- the wrong answer: appears then is struck through and fades -->
  <g opacity="0">
    <text x="208" y="80" fill="#D97777" font-size="9">noted &#215;5</text>
    <line x1="206" y1="76" x2="256" y2="76" stroke="#D97777" stroke-width="1.1" stroke-dasharray="50" stroke-dashoffset="50">
      <animate attributeName="stroke-dashoffset" values="50;0" dur="150ms" begin="1.35s;10.35s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="stroke-dashoffset" values="50" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </line>
    <animate attributeName="opacity" values="0;1" dur="140ms" begin="1.2s;10.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="260ms" begin="1.7s;10.7s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
  </g>

  <!-- the pass: four steps drawn down a spine -->
  <line x1="212" y1="98" x2="212" y2="176" stroke="#22202E" stroke-width="1" stroke-dasharray="78" stroke-dashoffset="78">
    <animate attributeName="stroke-dashoffset" values="78;0" dur="420ms" begin="2.0s;11.0s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
    <animate attributeName="stroke-dashoffset" values="78" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
  </line>
  <g font-size="8.5" fill="#7FA8E0">
    <g opacity="0"><circle cx="212" cy="104" r="2.4" fill="#7FA8E0"/><text x="222" y="107">collect</text>
      <animate attributeName="opacity" values="0;1" dur="120ms" begin="2.15s;11.15s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/></g>
    <g opacity="0"><circle cx="212" cy="128" r="2.4" fill="#7FA8E0"/><text x="222" y="131">ground</text>
      <animate attributeName="opacity" values="0;1" dur="120ms" begin="2.27s;11.27s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/></g>
    <g opacity="0"><circle cx="212" cy="152" r="2.4" fill="#7FA8E0"/><text x="222" y="155">extend</text>
      <animate attributeName="opacity" values="0;1" dur="120ms" begin="2.39s;11.39s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/></g>
    <g opacity="0"><circle cx="212" cy="176" r="2.4" fill="#D97777"/><text x="222" y="179" fill="#D97777">object</text>
      <animate attributeName="opacity" values="0;1" dur="120ms" begin="2.51s;11.51s" fill="freeze"/><animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/></g>
  </g>

  <!-- the map: gel-otur, 180ms stagger -->
  <rect x="296" y="56" width="304" height="132" rx="7" fill="#131220" stroke="#8FD6BD" stroke-opacity="0.26"/>
  <text x="310" y="74" fill="#8FD6BD" font-size="9.5" opacity="0">ONE MAP
    <animate attributeName="opacity" values="0;1" dur="260ms" begin="2.9s;11.9s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
    <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
  </text>
  <g font-size="8.5">
    <g opacity="0" transform="translate(0,5)">
      <text x="310" y="96" fill="#5C5870">grounded</text><text x="382" y="96" fill="#D8D5E4">3 of 5 already exist in your notes</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.1s;12.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.1s;12.1s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0,5)">
      <text x="310" y="118" fill="#5C5870">extended</text><text x="382" y="118" fill="#B1A3C8">2 additions — tagged as mine, not yours</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.28s;12.28s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.28s;12.28s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0,5)">
      <text x="310" y="140" fill="#5C5870">objection</text><text x="382" y="140" fill="#D97777">seed 4 collides with a sealed decision</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.46s;12.46s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.46s;12.46s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0,5)">
      <text x="310" y="162" fill="#5C5870">steer</text><text x="382" y="162" fill="#E8B562">4 forks, each with a measured cost</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.64s;12.64s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.64s;12.64s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
    <g opacity="0" transform="translate(0,5)">
      <text x="310" y="180" fill="#5C5870">banked</text><text x="382" y="180" fill="#8FD6BD">one entry, appended to the same series</text>
      <animate attributeName="opacity" values="0;1" dur="180ms" begin="3.82s;12.82s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0" dur="180ms" begin="3.82s;12.82s" fill="freeze" calcMode="spline" keySplines=".22 1 .36 1"/>
      <animate attributeName="opacity" values="1;0" dur="1ms" begin="8.9s;17.9s" fill="freeze"/>
    </g>
  </g>

  <text x="320" y="222" text-anchor="middle" fill="#D8D5E4" font-size="10.5">Amplifying everything equally is how an idea burst fails.</text>
  <text x="320" y="238" text-anchor="middle" fill="#5C5870" font-size="9">one map beats five acknowledgements</text>
</svg>
