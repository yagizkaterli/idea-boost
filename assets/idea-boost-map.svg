<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256" font-family="'Cascadia Code','Consolas',monospace">
  <rect width="640" height="256" rx="12" fill="#0E0D13"/>
  <rect x="0" y="0" width="640" height="34" rx="12" fill="#14131C"/>
  <circle cx="20" cy="17" r="5" fill="#F4645D"/>
  <circle cx="38" cy="17" r="5" fill="#F9BD4F"/>
  <circle cx="56" cy="17" r="5" fill="#3FC84F"/>
  <text x="320" y="22" text-anchor="middle" fill="#8B8798" font-size="12">idea-boost — five bursts, one grounded map</text>

  <!-- incoming seeds -->
  <text x="24" y="58" fill="#8B8798" font-size="11">SEEDS IN</text>
  <g font-size="10">
    <g><rect x="22" y="66" width="150" height="20" rx="4" fill="#191826"/><text x="32" y="80" fill="#B1A3C8">what if rooms had presence</text>
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.06;1" dur="12s" repeatCount="indefinite"/></g>
    <g><rect x="22" y="92" width="150" height="20" rx="4" fill="#191826"/><text x="32" y="106" fill="#B1A3C8">and receipts could chain</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.10;0.14;1" dur="12s" repeatCount="indefinite"/></g>
    <g><rect x="22" y="118" width="150" height="20" rx="4" fill="#191826"/><text x="32" y="132" fill="#B1A3C8">maybe a tribe roster too</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.20;1" dur="12s" repeatCount="indefinite"/></g>
    <g><rect x="22" y="144" width="150" height="20" rx="4" fill="#191826"/><text x="32" y="158" fill="#B1A3C8">also a decision surface</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.26;1" dur="12s" repeatCount="indefinite"/></g>
    <g><rect x="22" y="170" width="150" height="20" rx="4" fill="#191826"/><text x="32" y="184" fill="#B1A3C8">and the graph, obviously</text>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.32;1" dur="12s" repeatCount="indefinite"/></g>
  </g>

  <!-- the wrong answer -->
  <text x="196" y="80" fill="#D97777" font-size="10">noted &#215;5
    <animate attributeName="opacity" values="0;0;0.85;0.85;0" keyTimes="0;0.34;0.38;0.46;0.50" dur="12s" repeatCount="indefinite"/>
  </text>
  <line x1="192" y1="86" x2="252" y2="86" stroke="#D97777" stroke-width="1.2">
    <animate attributeName="opacity" values="0;0;0.6;0.6;0" keyTimes="0;0.40;0.44;0.46;0.50" dur="12s" repeatCount="indefinite"/>
  </line>

  <!-- the pass -->
  <text x="196" y="126" fill="#8B8798" font-size="10">ONE PASS
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.54;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <g font-size="9.5" fill="#7FA8E0">
    <text x="196" y="144">collect<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.52;0.56;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="196" y="158">ground<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.56;0.60;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="196" y="172">extend<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.64;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="196" y="186">object<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.68;1" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- output map -->
  <rect x="278" y="60" width="340" height="146" rx="8" fill="#151420" stroke="#8FD6BD" stroke-opacity="0.3"/>
  <text x="292" y="80" fill="#8FD6BD" font-size="11">ONE MAP
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.72;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <g font-size="10">
    <text x="292" y="102" fill="#8B8798">grounded</text>
    <text x="372" y="102" fill="#E9E7F0">3 of 5 already exist in your notes
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.70;0.74;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="292" y="124" fill="#8B8798">extended</text>
    <text x="372" y="124" fill="#B1A3C8">2 additions &#8212; tagged as mine, not yours
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.78;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="292" y="146" fill="#8B8798">objection</text>
    <text x="372" y="146" fill="#D97777">seed 4 collides with a sealed decision
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.82;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="292" y="168" fill="#8B8798">steer</text>
    <text x="372" y="168" fill="#E8B562">4 forks, each with a measured cost
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="292" y="190" fill="#8B8798">banked</text>
    <text x="372" y="190" fill="#8FD6BD">one entry, appended to the same series
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.90;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="320" y="232" text-anchor="middle" fill="#5C5870" font-size="10">amplifying everything equally is how idea bursts fail</text>
</svg>
